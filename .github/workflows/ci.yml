name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm install (not ci) + no npm cache: package-lock.json cannot be
      # generated in the authoring environment (registry blocked). Once a real
      # lock is committed, restore `cache: npm` and `npm ci`.
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
